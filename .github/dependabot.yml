# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  # Base images referenced by FROM in each image's Dockerfile.
  - package-ecosystem: "docker"
    directories:
      - "/images/base"
      - "/images/cuda-runtime"
    schedule:
      interval: weekly

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
