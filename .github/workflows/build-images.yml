name: Build Images

on:
  push:
    branches: [main]
    paths: ['images/**', 'docker-bake.hcl', '.github/workflows/build-images.yml']
  pull_request:
    paths: ['images/**', 'docker-bake.hcl', '.github/workflows/build-images.yml']
  workflow_dispatch:
    inputs:
      bake_target:
        description: 'Bake target (base, ml-libs, gpu-ml, dotnet-sdk, docker-tools, devcontainer, all). Empty = all.'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io/
  IMAGE_PREFIX: goldsam/ml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The CUDA stack is multi-GB; the stock runner does not have room for it
      # alongside the pre-installed toolchains.
      - name: Free disk space
        run: |
          docker system prune -af --volumes || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: ${{ github.event.inputs.bake_target || 'all' }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
        env:
          # Cache mounts (--mount=type=cache) are not exported by any cache
          # backend and the runner gets a fresh builder each time, so registry
          # layer cache is what actually saves time here.
          CACHE_TYPE: registry
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          VERSION: latest
          GIT_REVISION: ${{ github.sha }}
          GIT_REPO_URL: https://github.com/${{ github.repository }}
          BUILDKIT_PROGRESS: plain

      - name: Smoke test devcontainer
        if: github.event_name == 'pull_request'
        run: ./smoke-test.sh --image ${{ env.REGISTRY }}${{ env.IMAGE_PREFIX }}-devcontainer:latest
